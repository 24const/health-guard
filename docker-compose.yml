services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram-tracker-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    container_name: telegram-tracker
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    container_name: telegram-tracker-backup
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >
      while true; do
        ts=$$(date -u +%Y-%m-%d);
        PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "/backups/bot-$$ts.dump";
        ls -1t /backups/bot-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP+1)) | xargs -r rm --;
        sleep 86400;
      done

volumes:
  postgres_data:
